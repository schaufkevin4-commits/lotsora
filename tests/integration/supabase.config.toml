# Ausschließlich synthetische Tests; getrennt vom Entwicklungsprojekt lotsora.
project_id = "lotsora-integration"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = true
port = 55324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3109"
additional_redirect_urls = ["http://127.0.0.1:3108/auth/confirm**", "http://127.0.0.1:3109/auth/confirm**"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Lotsora: E-Mail bestätigen"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Lotsora: Passwort zurücksetzen"
content_path = "./supabase/templates/recovery.html"

[edge_runtime]
enabled = false

[analytics]
enabled = false
