<!doctype html>
<html lang="de"><body>
  <h1>Passwort zurücksetzen</h1>
  <p>Über diesen einmaligen Link kannst du ein neues Passwort für Lotsora festlegen.</p>
  <!-- Die App übergibt /auth/confirm?next=/passwort-neu als redirectTo. -->
  <p><a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=recovery">Neues Passwort festlegen</a></p>
  <p>Wenn du dies nicht angefordert hast, kannst du diese Nachricht ignorieren.</p>
</body></html>
