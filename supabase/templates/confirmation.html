<!doctype html>
<html lang="de"><body>
  <h1>E-Mail-Adresse bestätigen</h1>
  <p>Bestätige deine E-Mail-Adresse, um dein Lotsora-Konto zu verwenden.</p>
  <!-- Die App übergibt /auth/confirm?next=... als emailRedirectTo. -->
  <p><a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=email">E-Mail bestätigen</a></p>
  <p>Wenn du kein Konto angelegt hast, kannst du diese Nachricht ignorieren.</p>
</body></html>
